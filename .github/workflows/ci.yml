name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install pypdf fonttools brotli
      - run: npm test
      - run: npm run test:font
      - run: npm run test:audit
      - run: npm run audit:data
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:print-edges
      - run: npm run test:review-ui
      - run: npm run test:preview
      - run: npm run test:production
      - run: npm run test:pdf
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: worksheet-v2-verification
          path: artifacts/v2/
          if-no-files-found: ignore
